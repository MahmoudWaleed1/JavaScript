<html>
    <head>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=PT+Sans+Caption:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">
         <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />    
    </head>
    <body>
            <div class="container">
            <h1 class="m-auto">Bookmarker</h1>
            <div class="search">
                <h2 class="text-center fs-3">
                    <i class="fa-solid fa-bookmark"></i> Bookmark your favorite sites <i class="fa-solid fa-bookmark"></i>
                </h2>
                <h6><i class="fa-solid fa-book"></i> Site Name</h6>
                <input class="rounded-2 mb-4" name="name" id="name" placeholder="Bookmark Name" type="text">
                <h6><i class="fa-solid fa-link"></i> Site URL</h6>
                <input class="rounded-2 " name="url" id="url" placeholder="Website URL" type="text">
                <p id="urlAlert" class="alert alert-danger py-0 px-1 d-none">URL must start with https and not exceed 200 characters</p>
                <button type="submit" class="submit rounded-2 m-auto mt-4" onclick="addLink()">Submit</button>
            </div>
             <table class="table text-center">
                <thead>
                    <th>Index</th>
                    <th>Website Name</th>
                    <th>Visit</th>
                    <th>Delete</th>
                </thead>
                <tbody id="tbody">

                </tbody>
             </table>
            </div>


                  <script
         src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js">
            </script>
        <script src="index.js"></script>
    </body>
</html>
